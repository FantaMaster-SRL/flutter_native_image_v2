name: flutter_native_image_v2
description: A flutter plugin which uses native iOS/Android to resize, compress or crop
version: 1.1.6
homepage: https://laurenscodes.space
issue_tracker: https://github.com/FantaMaster-SRL/flutter_native_image_v2/issues

repository: https://github.com/FantaMaster-SRL/flutter_native_image_v2

dependencies:
  flutter:
    sdk: flutter

environment:
  sdk: '>=3.2.1 <4.0.0'
  flutter: ">=3.16.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutternativeimage
        pluginClass: FlutterNativeImagePlugin
      ios:
        package: com.example.flutternativeimage
        pluginClass: FlutterNativeImagePlugin
